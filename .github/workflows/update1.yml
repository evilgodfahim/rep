name: RSS Feed Processor

on:
  schedule:
    - cron: "50 */2 * * *"
  workflow_dispatch: {}

concurrency:
  group: rss-feed-processor
  cancel-in-progress: false

jobs:
  process-feeds:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Run RSS processor
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MS: ${{ secrets.MS }}
        run: |
          set -euo pipefail

          max_attempts=4
          base_delay=600
          delay_step=300

          for attempt in $(seq 1 $max_attempts); do
            echo "Attempt $attempt/$max_attempts"
            if python main1.py; then
              exit 0
            fi

            if [ $attempt -lt $max_attempts ]; then
              delay=$(( base_delay + (attempt - 1) * delay_step ))
              echo "Failed. Waiting ${delay}s before retry $((attempt + 1))..."
              sleep $delay
            fi
          done

          echo "All $max_attempts attempts exhausted."
          exit 1

      - name: Commit processed files
        shell: bash
        run: |
          set -euo pipefail

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add processed_articles.json selected_articles.json fetch_stats.json *.xml

          if ! git diff --cached --quiet; then
            git commit -m "Update feeds - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          else
            echo "No changes to commit."
          fi